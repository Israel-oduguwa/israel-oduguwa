<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" role="img" aria-labelledby="title desc">
  <title id="title">Incremental migration cutover</title>
  <desc id="desc">The legacy writer feeds a replacement projection. Parity and lag are checked before readers move. Writer ownership transfers only after recovery is ready.</desc>
  <rect width="360" height="470" fill="#fff"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#2563eb"/></marker></defs>
  <g fill="#f1f5f9" stroke="#94a3b8"><rect x="30" y="28" width="300" height="62" rx="8"/><rect x="30" y="142" width="300" height="62" rx="8"/><rect x="30" y="256" width="300" height="62" rx="8"/><rect x="30" y="370" width="300" height="72" rx="8" fill="#eff6ff" stroke="#2563eb"/></g>
  <g fill="#172034" text-anchor="middle" font-family="sans-serif" font-size="20"><text x="180" y="67">One legacy writer</text><text x="180" y="181">Build the projection</text><text x="180" y="295">Verify, then move reads</text><text x="180" y="400">Transfer the writer</text><text x="180" y="427">with recovery ready</text></g>
  <g stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"><path d="M180 90V137"/><path d="M180 204V251"/><path d="M180 318V365"/></g>
</svg>
