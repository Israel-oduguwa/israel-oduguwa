<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
  <title id="title">Split task families before releasing training records</title>
  <desc id="desc">A source issue and its variants share one lineage. The lineage is assigned to one dataset split. Reviewed demonstrations and preference records inherit that split.</desc>
  <rect width="360" height="420" fill="#fff"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#2563eb"/></marker></defs>
  <g fill="#f1f5f9" stroke="#94a3b8"><rect x="30" y="24" width="300" height="58" rx="8"/><rect x="30" y="124" width="300" height="58" rx="8"/><rect x="30" y="224" width="300" height="58" rx="8" fill="#eff6ff" stroke="#2563eb"/><rect x="30" y="324" width="300" height="68" rx="8"/></g>
  <g fill="#172034" text-anchor="middle" font-family="sans-serif" font-size="20"><text x="180" y="60">Source issue + variants</text><text x="180" y="160">One lineage group</text><text x="180" y="260">Assign one split</text><text x="180" y="351">Review demonstrations</text><text x="180" y="378">and preference pairs</text></g>
  <g stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"><path d="M180 82V119"/><path d="M180 182V219"/><path d="M180 282V319"/></g>
</svg>
