<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" role="img" aria-labelledby="title desc">
  <title id="title">Billing evidence and entitlement policy</title>
  <desc id="desc">An authenticated notification enters the durable inbox. Financial records are synchronized under ownership. Versioned entitlement policy derives the access decision from that evidence.</desc>
  <rect width="360" height="470" fill="#fff"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#2563eb"/></marker></defs>
  <g fill="#f1f5f9" stroke="#94a3b8"><rect x="30" y="28" width="300" height="62" rx="8"/><rect x="30" y="142" width="300" height="62" rx="8"/><rect x="30" y="256" width="300" height="62" rx="8" fill="#eff6ff" stroke="#2563eb"/><rect x="30" y="370" width="300" height="72" rx="8"/></g>
  <g fill="#172034" text-anchor="middle" font-family="sans-serif" font-size="20"><text x="180" y="67">Verified notification</text><text x="180" y="181">Durable inbox + evidence</text><text x="180" y="295">Entitlement policy</text><text x="180" y="413">Explainable access</text></g>
  <g stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"><path d="M180 90V137"/><path d="M180 204V251"/><path d="M180 318V365"/></g>
</svg>
