<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
  <title id="title">Independent evaluation observation</title>
  <desc id="desc">A candidate receives the task and submits a patch. A controlled runner observes effects. The protected grader decides acceptance independently of the candidate's claims.</desc>
  <rect width="360" height="420" fill="#fff"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#2563eb"/></marker></defs>
  <g fill="#f1f5f9" stroke="#94a3b8"><rect x="30" y="24" width="300" height="58" rx="8"/><rect x="30" y="124" width="300" height="58" rx="8"/><rect x="30" y="234" width="300" height="58" rx="8"/><rect x="30" y="334" width="300" height="58" rx="8" fill="#eff6ff" stroke="#2563eb"/></g>
  <g fill="#172034" text-anchor="middle" font-family="sans-serif" font-size="20"><text x="180" y="60">Task and allowed context</text><text x="180" y="160">Candidate patch</text><text x="180" y="270">Observe actual effects</text><text x="180" y="370">Authoritative verdict</text></g>
  <g stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"><path d="M180 82V119"/><path d="M180 182V229"/><path d="M180 292V329"/></g>
  <path d="M16 209H344" stroke="#536174" stroke-dasharray="5 5"/>
</svg>
