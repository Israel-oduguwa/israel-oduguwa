<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Israel O. Wordmark Logo</title>
  <desc id="desc">Premium personal brand wordmark logo for Israel O. with dark charcoal typography and emerald accent dots.</desc>

  <style>
    :root {
      --logo-dark: #111314;
      --logo-green: #1B7F5A;
    }
    .logo-dark { fill: var(--logo-dark); }
    .logo-green { fill: var(--logo-green); }
    .wordmark {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.075em;
    }
  </style>

  <!-- Left brand mark -->
  <g id="brand-mark" transform="translate(70 45)">
    <path id="mark-i" class="logo-dark" d="M0 0H76V160H31C13.8792 160 0 146.121 0 129V0Z"/>
    <circle id="mark-dot" class="logo-green" cx="130" cy="128" r="38"/>
  </g>

  <!-- Wordmark -->
  <g id="wordmark" transform="translate(300 0)">
    <text id="wordmark-text" class="logo-dark wordmark" x="0" y="178" font-size="150">Israel O</text>
    <circle id="wordmark-dot" class="logo-green" cx="750" cy="147" r="22"/>
  </g>
</svg>
